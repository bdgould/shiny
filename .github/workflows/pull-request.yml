name: Pull Request Validation

on:
  pull_request:
    branches:
      - main
      - develop

# Cancel in-progress runs when a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run type-check

  tests:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage-reports
          path: packages/*/coverage/
          retention-days: 30

      - name: Comment coverage on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const packages = ['main', 'preload', 'renderer'];
            const rows = [];
            for (const pkg of packages) {
              const file = `packages/${pkg}/coverage/coverage-summary.json`;
              if (!fs.existsSync(file)) {
                rows.push(`| ${pkg} | n/a | n/a | n/a | n/a |`);
                continue;
              }
              const t = JSON.parse(fs.readFileSync(file, 'utf8')).total;
              rows.push(`| ${pkg} | ${t.statements.pct}% | ${t.branches.pct}% | ${t.functions.pct}% | ${t.lines.pct}% |`);
            }

            const body = [
              '## Test Coverage Report',
              '',
              '| Package | Statements | Branches | Functions | Lines |',
              '|---------|------------|----------|-----------|-------|',
              ...rows,
              '',
              '_Measured across all source files. Thresholds live in each package\'s vitest.config.ts._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(
              (comment) => comment.user.type === 'Bot' && comment.body.includes('Test Coverage Report')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
