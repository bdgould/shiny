name: Build Installers

# Reusable workflow: builds every platform and architecture, merges the
# per-arch update manifests, verifies them, and uploads one `release-files`
# artifact. Used by release.yml and package-check.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS x64, os: macos-latest, arch: x64, artifact: macos-x64 }
          - { name: macOS arm64, os: macos-latest, arch: arm64, artifact: macos-arm64 }
          - { name: Windows x64, os: windows-latest, arch: x64, artifact: windows-x64 }
          - { name: Windows arm64, os: windows-latest, arch: arm64, artifact: windows-arm64 }
          - { name: Linux x64, os: ubuntu-latest, arch: x64, artifact: linux-x64 }
          - { name: Linux arm64, os: ubuntu-24.04-arm, arch: arm64, artifact: linux-arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  manifests:
    name: Merge and verify update manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Assemble release files
        run: |
          mkdir release
          # Installers and blockmaps from every build
          find artifacts -type f ! -name 'latest*.yml' -exec cp {} release/ \;
          # Linux writes a separate manifest per arch
          cp artifacts/linux-x64/latest-linux.yml release/
          cp artifacts/linux-arm64/latest-linux-arm64.yml release/
          # Windows and macOS write one manifest per build; merge them
          node scripts/merge-update-manifests.js release/latest.yml \
            artifacts/windows-x64/latest.yml artifacts/windows-arm64/latest.yml
          node scripts/merge-update-manifests.js release/latest-mac.yml \
            artifacts/macos-x64/latest-mac.yml artifacts/macos-arm64/latest-mac.yml
          node scripts/merge-update-manifests.js --verify release
          ls -la release

      - name: Upload release files
        uses: actions/upload-artifact@v5
        with:
          name: release-files
          path: release/
          if-no-files-found: error
